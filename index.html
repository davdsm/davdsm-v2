    <script>
      // Legacy hash routes (#/work, #/studio, …) → real paths before the app boots.
      (function () {
        var hash = window.location.hash || ''
        var match = hash.match(/^#\/(work\/[^/?#]+|studio|work|solutions|terms|privacy)\/?$/)
        if (!match) return
        window.location.replace('/' + match[1] + window.location.search)
